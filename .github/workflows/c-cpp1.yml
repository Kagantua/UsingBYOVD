# .github/workflows/build_windows_x64_fixed.yml
name: Build Windows x64 Executable (Fixed)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        
    # 修复行尾符和编码问题
    - name: Fix line endings and encoding
      shell: pwsh
      run: |
        # 查找所有 .cpp 和 .hpp 文件，转换行尾符为 Windows 格式
        Get-ChildItem -Recurse -Include *.cpp, *.hpp, *.h | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          # 移除 BOM 标记（如果存在）
          $content = $content -replace '^\uFEFF', ''
          # 统一换行符为 CRLF
          $content = $content -replace "`r`n", "`n" -replace "`n", "`r`n"
          [System.IO.File]::WriteAllText($_.FullName, $content, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Fixed: $($_.Name)"
        }
        
    # 尝试手动修复 DriverWorker.cpp 的具体问题
    - name: Manual fix DriverWorker.cpp
      shell: pwsh
      run: |
        $file = "DriverUtils/DriverWorker.cpp"
        if (Test-Path $file) {
          $content = Get-Content $file -Raw
          # 查找可能的语法错误并尝试修复
          # 检查是否有异常字符
          if ($content -match "[^\x00-\x7F]") {
            Write-Host "Found non-ASCII characters in DriverWorker.cpp"
            # 记录问题行
            $lines = $content -split "`r`n"
            for ($i=0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "[^\x00-\x7F]") {
                Write-Host "Line $($i+1): $($lines[$i])"
              }
            }
          }
        }
        
    # 添加 MSBuild 到 PATH
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.3
      
    # 尝试编译 Debug 版本以便更好地诊断
    - name: Build Debug Version First
      continue-on-error: true
      run: |
        msbuild UsingBYOVD.sln -m -p:Configuration=Debug -p:Platform=x64 -p:Verbosity=detailed
        
    # 编译 Release 版本
    - name: Build Release Version
      run: |
        msbuild UsingBYOVD.sln -m -p:Configuration=Release -p:Platform=x64 -p:Verbosity=minimal
        
    # 查找生成的 EXE
    - name: Locate Executable
      id: locate_exe
      run: |
        $exe_paths = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.DirectoryName -like "*Release*" -or $_.DirectoryName -like "*x64*" }
        if ($exe_paths.Count -gt 0) {
          $exe_path = $exe_paths[0].FullName
          echo "EXE_PATH=$exe_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "EXE_NAME=$($exe_paths[0].Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Found EXE: $exe_path"
        } else {
          Write-Host "::warning::未找到 EXE 文件，尝试查找所有编译输出"
          Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -match "Release|Debug|x64" } | ForEach-Object {
            Write-Host "Output directory: $($_.FullName)"
            Get-ChildItem $_.FullName -File
          }
        }
        
    # 上传所有编译产物
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build-Output
        path: |
          x64\**\*.exe
          Release\*.exe
          **\*.exe
          !**\*.pdb
        retention-days: 7
